[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libgen-service"
version = "1.0.0"
description = "Ad-free local search and download client for Library Genesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "libgen-service contributors" }]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
libgen-service = "libgen_service.cli:main"

[tool.setuptools]
packages = ["libgen_service"]

[tool.setuptools.package-data]
libgen_service = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that talk to real Libgen mirrors (deselected by default)",
]
addopts = "-m 'not network'"
